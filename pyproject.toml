[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tobacco-audit"
version = "0.1.0"
description = "Local source-code security auditing with reviewable findings"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
tobacco = "tobacco.cli:main"

[tool.setuptools.packages.find]
include = ["tobacco*"]
